[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatune"
version = "0.2.0"
description = "Autonomous meta-learning hyperparameter agent: dataset DNA extraction, a meta-learner brain, and an agentic orchestrator (plan / execute / critic / recover) that trains and tunes models with guardrails."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "joblib>=1.1.0",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.6.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
metatune-agent = "agent:main"

[tool.setuptools]
py-modules = [
    "agent",
    "data_analyzer",
    "brain",
    "engine",
    "engine_stream",
    "bilevel",
    "algorithm_recommender",
    "sklearn_engine",
    "pipeline",
    "vizier_stub",
    "designer_brain",
    "metatune_logging",
]
